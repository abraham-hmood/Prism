# ── Heaps, sized for THIS project ────────────────────────────────────────────────────────────────
#
# `-Xmx2048m` was the cause of "GC overhead limit exceeded" on both the desktop and the mobile
# build: with a 2 GB ceiling the compile of :core + :app + :desktop leaves almost nothing free, and
# a JVM whose heap is full of LIVE objects does not fail with OutOfMemoryError -- it spends all its
# time collecting and the JVM kills it with that message instead. The compiler is the peak consumer
# here: Kotlin + KSP generate a lot of classes, so metaspace matters as much as the heap.
#
# Sized to run alongside an IDE: the Gradle daemon keeps its own 6 GB, the Kotlin daemon compiles in
# its own 3 GB, and neither is a fixed commitment -- an idle daemon's pages are evictable.
#
# MaxMetaspaceSize is deliberately NOT unbounded. Metaspace exhaustion reports itself as a
# GC-overhead death too, and a bounded number with a clear failure is easier to read than a slow
# crawl into swap.
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1536m -XX:+UseG1GC -Dfile.encoding=UTF-8

# The Kotlin compiler runs in its own daemon; without this it inherits a small default and is the
# other place an OOM shows up on this codebase.
kotlin.daemon.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
